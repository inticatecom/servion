version: 2

updates:
  # Node.js
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"

  # C#
  - package-ecosystem: "nuget"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
