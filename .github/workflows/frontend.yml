name: "Frontend"

permissions:
  contents: read

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "*.config.*"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "*.config.*"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"

    steps:
      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v6

      # Initialize Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install Dependencies
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Linting
      - name: Run Linting Framework
        run: bun run lint

  typecheck:
    name: "Typecheck"
    runs-on: "ubuntu-latest"

    steps:
      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v6

      # Initialize Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install Dependencies
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Typechecking
      - name: Run Typechecking
        run: bun typecheck
  build:
    name: "Build"
    runs-on: "ubuntu-latest"

    steps:
      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v6

      # Initialize Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install Dependencies
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Build
      - name: Build
        run: bun --env-file=.env.example run --filter '@servion/web' build
