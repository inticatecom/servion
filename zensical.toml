[project]
site_name = "Servion"
site_url = "https://docs.inticate.com/servion/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/inticate.css"]
repo_url = "https://github.com/twobrake/servion"
repo_name = "twobrake/servion"
edit_uri = "edit/canary/docs"

[project.theme]
font.text = "Geist"
font.code = "Geist Mono"
logo = "images/logo.png"
favicon = "images/logo.png"
features = [
  "content.action.edit",
  "content.action.copy",
  "content.code.copy",
  "navigation.top",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.extra]
generator = false
